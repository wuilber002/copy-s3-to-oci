title: S3 Glacier to OCI Object Storage Migration
description: Provisions one Linux VM, OCI Vault/Key/Secrets, and optional least-privilege instance-principal IAM resources.
schemaVersion: 1.1.0
version: 0.1.0
locale: en
groupings:
  - title: VM configuration
    variables:
      - compartment_ocid
      - availability_domain
      - subnet_ocid
      - image_ocid
      - instance_shape
      - ocpus
      - memory_in_gbs
      - boot_volume_size_in_gbs
      - ssh_public_key
      - assign_public_ip
      - resource_name_prefix
      - bootstrap_repository
      - bootstrap_ref
  - title: Vault, Key and Secrets
    variables:
      - create_vault_key
      - vault_compartment_ocid
      - key_compartment_ocid
      - existing_vault_ocid
      - existing_vault_key_ocid
      - secrets_compartment_ocid
      - secret_compartment_ocids_json
      - create_platform_secrets
      - external_postgres_password_secret_ocid
      - create_initial_aws_connection_secret
      - initial_aws_connection_secret_name
      - initial_aws_connection_secret_compartment_ocid
  - title: Instance principal and OCI policy
    variables:
      - create_dynamic_group
      - dynamic_group_name
      - existing_dynamic_group_name
      - create_oci_policy
      - policy_compartment_ocid
      - destination_buckets_json
      - manage_secret_access_policy
  - title: Recovery
    variables:
      - backup_policy_id
      - create_boot_volume_backup_policy
      - backup_policy_compartment_ocid
variables:
  compartment_ocid:
    title: VM compartment
    type: oci:identity:compartment:id
    required: true
  availability_domain:
    title: Availability domain
    type: oci:identity:availabilitydomain:name
    dependsOn:
      compartmentId: ${compartment_ocid}
    required: true
  subnet_ocid:
    title: Existing subnet
    type: oci:core:subnet:id
    dependsOn:
      compartmentId: ${compartment_ocid}
    required: true
    description: The customer is responsible for HTTPS egress to AWS S3, AWS STS, OCI Vault, OCI Object Storage, and GitHub Releases.
  image_ocid:
    title: Linux image OCID
    type: string
    required: true
  instance_shape:
    title: VM shape
    type: string
    default: VM.Standard.E5.Flex
    required: true
  ocpus:
    title: OCPUs
    type: number
    default: 8
    required: true
  memory_in_gbs:
    title: Memory (GB)
    type: number
    default: 32
    required: true
  boot_volume_size_in_gbs:
    title: Boot volume size (GB)
    type: number
    default: 500
    required: true
  ssh_public_key:
    title: SSH public key
    type: string
    required: true
  assign_public_ip:
    title: Assign public IP to VM
    type: boolean
    default: false
    description: Enable only for a public subnet with SSH ingress restricted to the administrator network. The web interface remains localhost-only.
  resource_name_prefix:
    title: Resource name prefix
    type: string
    default: s3-oci-migration
    required: true
  bootstrap_repository:
    title: Bootstrap GitHub repository
    type: string
    default: https://github.com/wuilber002/copy-s3-to-oci.git
    required: true
  bootstrap_ref:
    title: Bootstrap release ref
    type: string
    default: main
    required: true
  vault_compartment_ocid:
    title: Vault compartment
    type: oci:identity:compartment:id
    visible: ${create_vault_key}
  key_compartment_ocid:
    title: Key compartment
    type: oci:identity:compartment:id
    visible: ${create_vault_key}
  secrets_compartment_ocid:
    title: Secrets compartment
    type: oci:identity:compartment:id
    required: true
  create_vault_key:
    title: Create Vault and Key
    type: boolean
    default: true
    required: true
    description: When disabled, provide existing Vault and Key OCIDs. Terraform can still create platform Secrets in that Vault.
  existing_vault_ocid:
    title: Existing Vault OCID
    type: string
    required: true
    visible: ${create_vault_key == false}
  existing_vault_key_ocid:
    title: Existing Vault Key OCID
    type: string
    required: true
    visible: ${create_vault_key == false}
  secret_compartment_ocids_json:
    title: AWS Secret discovery compartments JSON
    type: string
    default: '[]'
    description: Additional compartments whose readable Secrets should appear in RAIJIN after explicit refresh, e.g. ["ocid1.compartment..."].
  create_platform_secrets:
    title: Create platform Secrets
    type: boolean
    default: true
    required: true
    description: Creates the PostgreSQL password Secret. Disable only when the customer supplies it and manages Secret access outside this stack.
  external_postgres_password_secret_ocid:
    title: Existing PostgreSQL password Secret OCID
    type: string
    required: true
    visible: ${create_platform_secrets == false}
  create_initial_aws_connection_secret:
    title: Create initial AWS connection JSON Secret
    type: boolean
    default: false
    required: true
    description: Creates an optional template Secret. Replace placeholders, then refresh OCI Secrets and register it in Settings → AWS Connections.
  initial_aws_connection_secret_name:
    title: Initial AWS connection Secret name
    type: string
    required: true
    visible: ${create_initial_aws_connection_secret}
  initial_aws_connection_secret_compartment_ocid:
    title: Initial Secret compartment (optional)
    type: oci:identity:compartment:id
    visible: ${create_initial_aws_connection_secret}
  create_dynamic_group:
    title: Create dynamic group
    type: boolean
    default: true
    required: true
  dynamic_group_name:
    title: New dynamic group name (optional)
    type: string
    description: Leave blank to use <resource-name-prefix>-vm.
    visible: ${create_dynamic_group}
  existing_dynamic_group_name:
    title: Existing dynamic group name
    type: string
    required: true
    visible: ${create_dynamic_group == false}
  create_oci_policy:
    title: Create OCI policy
    type: boolean
    default: true
    required: true
    description: Warning: OCI limits the number of policy statements by compartment. Destination policies use two statements per distinct bucket compartment; Secret access policies are configured separately and use two statements per Secret compartment.
  policy_compartment_ocid:
    title: Policy compartment
    type: oci:identity:compartment:id
    required: true
    visible: ${create_oci_policy}
    description: Must be the tenancy root or a parent compartment that governs all destination-bucket compartments.
  destination_buckets_json:
    title: Destination buckets JSON
    type: string
    required: true
    visible: ${create_oci_policy}
    description: '[{"name":"destination-a","compartment_id":"ocid1.compartment..."}]. Buckets in the same compartment become one policy statement.'
  manage_secret_access_policy:
    title: Create Secret discovery/read policies
    type: boolean
    default: true
    required: true
    description: Creates two least-privilege statements in each configured Secret compartment: inspect Secret metadata and read Secret bundles. Disable only when the customer creates these policies independently.
  backup_policy_id:
    title: Existing boot-volume backup policy OCID (optional)
    type: string
    visible: ${create_boot_volume_backup_policy == false}
    description: Assign an existing automatic backup policy when Terraform should not create one.
  create_boot_volume_backup_policy:
    title: Create automatic boot-volume backup policy
    type: boolean
    default: true
    required: true
    description: Creates and attaches a daily incremental backup policy retaining 14 days.
  backup_policy_compartment_ocid:
    title: Backup policy compartment (optional)
    type: oci:identity:compartment:id
    visible: ${create_boot_volume_backup_policy}
    description: Leave blank to create the policy in the VM compartment.
